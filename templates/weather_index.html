<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报 - 实时天气查询</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            opacity: 0.8;
            font-size: 0.95rem;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .city-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .city-tag {
            padding: 8px 16px;
            background: #f5f5f5;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            color: #666;
        }

        .city-tag:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .city-tag.active {
            background: #667eea;
            color: white;
        }

        .weather-main {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .current-weather {
            text-align: center;
            color: #333;
        }

        .current-weather .city-name {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 10px;
        }

        .current-weather .temp {
            font-size: 5rem;
            font-weight: 200;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }

        .current-weather .weather-text {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-item .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .detail-item .value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .chart-container {
            height: 300px;
            width: 100%;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .forecast-card .date {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .forecast-card .icon {
            font-size: 2rem;
            margin: 8px 0;
        }

        .forecast-card .temp-high {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .forecast-card .temp-low {
            font-size: 13px;
            color: #999;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .indices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .index-card {
            background: #f8f9fa;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s;
        }

        .index-card:hover {
            background: #eef0ff;
        }

        .index-card .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .index-card .name {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .index-card .level {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .aqi-section {
            margin-bottom: 20px;
        }

        .aqi-display {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .aqi-value {
            text-align: center;
        }

        .aqi-value .number {
            font-size: 3rem;
            font-weight: 200;
            color: #52c41a;
        }

        .aqi-value .label {
            font-size: 14px;
            color: #999;
        }

        .aqi-details {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .aqi-detail {
            text-align: center;
        }

        .aqi-detail .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }

        .aqi-detail .value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .data-source {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .weather-main {
                grid-template-columns: 1fr;
            }
            .bottom-section {
                grid-template-columns: 1fr;
            }
            .forecast-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .forecast-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .indices-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .weather-details {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ 天气预报</h1>
            <p>实时天气查询 · 7日预报 · 生活指数</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="cityInput" placeholder="输入城市名称，如：北京、上海、成都..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="searchCity()">搜索天气</button>
            </div>
            <div class="city-tags" id="cityTags"></div>
        </div>

        <div class="weather-main">
            <div class="weather-card">
                <div class="current-weather">
                    <div class="city-name" id="cityName">北京</div>
                    <div class="weather-icon" id="weatherIcon" style="font-size: 4rem;">☀️</div>
                    <div class="temp" id="currentTemp">28°C</div>
                    <div class="weather-text" id="weatherText">晴</div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="label">💧 湿度</div>
                        <div class="value" id="humidity">45%</div>
                    </div>
                    <div class="detail-item">
                        <div class="label">💨 风速</div>
                        <div class="value" id="windSpeed">3 km/h</div>
                    </div>
                    <div class="detail-item">
                        <div class="label">🧭 风向</div>
                        <div class="value" id="windDir">东风</div>
                    </div>
                    <div class="detail-item">
                        <div class="label">🌡️ 气压</div>
                        <div class="value" id="pressure">1013 hPa</div>
                    </div>
                </div>
            </div>

            <div class="weather-card">
                <div class="section-title">24小时温度趋势</div>
                <div class="chart-container" id="hourlyChart"></div>
            </div>
        </div>

        <div class="section-title" style="color: white; margin-bottom: 15px;">
            <span style="background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 10px; font-weight: 500;">7日天气预报</span>
        </div>
        <div class="forecast-grid" id="forecastGrid"></div>

        <div class="bottom-section">
            <div class="weather-card">
                <div class="section-title">温度趋势</div>
                <div class="chart-container" id="dailyChart" style="height: 280px;"></div>
            </div>

            <div class="weather-card">
                <div class="section-title">空气质量</div>
                <div class="aqi-section">
                    <div class="aqi-display">
                        <div class="aqi-value">
                            <div class="number" id="aqiValue">50</div>
                            <div class="label" id="aqiLevel">优</div>
                        </div>
                        <div class="aqi-details">
                            <div class="aqi-detail">
                                <div class="label">PM2.5</div>
                                <div class="value" id="pm25">35</div>
                            </div>
                            <div class="aqi-detail">
                                <div class="label">PM10</div>
                                <div class="value" id="pm10">50</div>
                            </div>
                            <div class="aqi-detail">
                                <div class="label">O₃</div>
                                <div class="value" id="o3">60</div>
                            </div>
                            <div class="aqi-detail">
                                <div class="label">NO₂</div>
                                <div class="value" id="no2">20</div>
                            </div>
                            <div class="aqi-detail">
                                <div class="label">SO₂</div>
                                <div class="value" id="so2">10</div>
                            </div>
                            <div class="aqi-detail">
                                <div class="label">CO</div>
                                <div class="value" id="co">1.0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title">生活指数</div>
                <div class="indices-grid" id="indicesGrid"></div>
            </div>
        </div>

        <div class="data-source" id="dataSource">数据来源: Open-Meteo</div>
    </div>

    <script>
        const POPULAR_CITIES = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '西安', '南京', '重庆', '苏州', '天津'];
        let hourlyChart = null;
        let dailyChart = null;

        function init() {
            renderCityTags();
            loadWeather('北京');
        }

        function renderCityTags() {
            const container = document.getElementById('cityTags');
            container.innerHTML = POPULAR_CITIES.map(city =>
                `<div class="city-tag" onclick="loadWeather('${city}')">${city}</div>`
            ).join('');
        }

        function getWeatherIcon(text) {
            const icons = {
                '晴': '☀️', '多云': '⛅', '阴': '☁️', '雾': '🌫️',
                '小雨': '🌧️', '中雨': '🌧️', '大雨': '⛈️', '雷阵雨': '⛈️',
                '阵雨': '🌦️', '毛毛雨': '🌦️', '小雪': '🌨️', '中雪': '❄️', '大雪': '❄️'
            };
            return icons[text] || '🌤️';
        }

        function getAQIColor(aqi) {
            if (aqi <= 50) return '#52c41a';
            if (aqi <= 100) return '#faad14';
            if (aqi <= 150) return '#fa8c16';
            if (aqi <= 200) return '#f5222d';
            return '#722ed1';
        }

        function loadWeather(city) {
            document.querySelectorAll('.city-tag').forEach(tag => {
                tag.classList.toggle('active', tag.textContent === city);
            });

            fetch(`/api/weather?city=${encodeURIComponent(city)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                        return;
                    }
                    renderWeather(data);
                })
                .catch(err => {
                    console.error('加载失败:', err);
                });
        }

        function renderWeather(data) {
            const current = data.current;

            document.getElementById('dataSource').textContent = '数据来源: ' + (
                data.data_source === 'open-meteo' ? 'Open-Meteo(实时数据)' :
                data.data_source === 'weather.com.cn' ? '中国天气网' :
                data.data_source || '模拟数据'
            );

            document.getElementById('cityName').textContent = data.city;
            document.getElementById('currentTemp').textContent = current.temp + '°C';
            document.getElementById('weatherText').textContent = current.text;
            document.getElementById('weatherIcon').textContent = getWeatherIcon(current.text);
            document.getElementById('humidity').textContent = current.humidity + '%';
            document.getElementById('windSpeed').textContent = current.wind_speed + ' km/h';
            document.getElementById('windDir').textContent = current.wind_dir;
            document.getElementById('pressure').textContent = current.pressure + ' hPa';

            if (data.air_quality) {
                const aqi = data.air_quality;
                document.getElementById('aqiValue').textContent = aqi.aqi;
                document.getElementById('aqiValue').style.color = getAQIColor(aqi.aqi);
                document.getElementById('aqiLevel').textContent = aqi.category;
                document.getElementById('pm25').textContent = aqi.pm25;
                document.getElementById('pm10').textContent = aqi.pm10;
                document.getElementById('o3').textContent = aqi.o3;
                document.getElementById('no2').textContent = aqi.no2;
                document.getElementById('so2').textContent = aqi.so2;
                document.getElementById('co').textContent = aqi.co;
            }

            renderForecast(data.daily);
            renderIndices(data.indices);
            renderHourlyChart(data.hourly);
            renderDailyChart(data.daily);
        }

        function renderForecast(daily) {
            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = daily.map(day => {
                const date = day.date;
                const dayName = new Date(date).toLocaleDateString('zh-CN', { weekday: 'short' });
                return `
                    <div class="forecast-card">
                        <div class="date">${date.slice(5)} ${dayName}</div>
                        <div class="icon">${getWeatherIcon(day.text_day)}</div>
                        <div class="temp-high">${day.temp_max}°</div>
                        <div class="temp-low">${day.temp_min}°</div>
                    </div>
                `;
            }).join('');
        }

        function renderIndices(indices) {
            const grid = document.getElementById('indicesGrid');
            const icons = {
                '舒适度': '😊', '穿衣': '👕', '运动': '🏃',
                '紫外线': '☀️', '洗车': '🚗', '旅游': '🎒'
            };
            grid.innerHTML = indices.slice(0, 6).map(idx => `
                <div class="index-card">
                    <div class="icon">${icons[idx.name] || '📊'}</div>
                    <div class="name">${idx.name}</div>
                    <div class="level">${idx.level}</div>
                </div>
            `).join('');
        }

        function renderHourlyChart(hourly) {
            const dom = document.getElementById('hourlyChart');
            if (!hourlyChart) {
                hourlyChart = echarts.init(dom);
            }

            const times = hourly.map(h => h.time.slice(11, 16));
            const temps = hourly.map(h => h.temp);

            hourlyChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: '{b}<br/>温度: {c}°C'
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: times,
                    axisLine: { lineStyle: { color: '#ddd' } },
                    axisLabel: { color: '#999', fontSize: 11 }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { show: false },
                    splitLine: { lineStyle: { color: '#f0f0f0' } },
                    axisLabel: { color: '#999', fontSize: 11, formatter: '{value}°' }
                },
                series: [{
                    data: temps,
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    lineStyle: {
                        width: 3,
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 1, y2: 0,
                            colorStops: [
                                { offset: 0, color: '#667eea' },
                                { offset: 1, color: '#764ba2' }
                            ]
                        }
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(102, 126, 234, 0.3)' },
                                { offset: 1, color: 'rgba(118, 75, 162, 0.05)' }
                            ]
                        }
                    }
                }]
            });
        }

        function renderDailyChart(daily) {
            const dom = document.getElementById('dailyChart');
            if (!dailyChart) {
                dailyChart = echarts.init(dom);
            }

            const dates = daily.map(d => d.date.slice(5));
            const highTemps = daily.map(d => d.temp_max);
            const lowTemps = daily.map(d => d.temp_min);

            dailyChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        let result = params[0].name + '<br/>';
                        params.forEach(p => {
                            result += p.marker + p.seriesName + ': ' + p.value + '°C<br/>';
                        });
                        return result;
                    }
                },
                legend: {
                    data: ['最高温', '最低温'],
                    top: 0,
                    textStyle: { color: '#999', fontSize: 12 }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLine: { lineStyle: { color: '#ddd' } },
                    axisLabel: { color: '#999', fontSize: 11 }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { show: false },
                    splitLine: { lineStyle: { color: '#f0f0f0' } },
                    axisLabel: { color: '#999', fontSize: 11, formatter: '{value}°' }
                },
                series: [
                    {
                        name: '最高温',
                        data: highTemps,
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: { color: '#f5222d', width: 2 },
                        itemStyle: { color: '#f5222d' }
                    },
                    {
                        name: '最低温',
                        data: lowTemps,
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        lineStyle: { color: '#1890ff', width: 2 },
                        itemStyle: { color: '#1890ff' }
                    }
                ]
            });
        }

        function searchCity() {
            const input = document.getElementById('cityInput');
            const city = input.value.trim();
            if (city) {
                loadWeather(city);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchCity();
            }
        }

        window.addEventListener('resize', () => {
            if (hourlyChart) hourlyChart.resize();
            if (dailyChart) dailyChart.resize();
        });

        init();
    </script>
</body>
</html>
